name: Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.NEXUS_REGISTRY }}
          username: ${{ secrets.NEXUS_USERNAME }}
          password: ${{ secrets.NEXUS_PASSWORD }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/negativeone-frontend:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/negativeone-frontend:latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.NEXUS_REGISTRY }}/negativeone-backend:${{ github.sha }}
            ${{ secrets.NEXUS_REGISTRY }}/negativeone-backend:latest

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEXUS_REGISTRY: ${{ secrets.NEXUS_REGISTRY }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: NEXUS_REGISTRY,NEXUS_USERNAME,NEXUS_PASSWORD
          script: |
            set -e
            if [ ! -d /opt/negativeone/.git ]; then
              rm -rf /opt/negativeone
              git clone https://github.com/SamCutmore/negativeone.git /opt/negativeone
            fi
            cd /opt/negativeone
            git fetch origin
            git reset --hard ${{ github.sha }}
            echo "$NEXUS_PASSWORD" | docker login "$NEXUS_REGISTRY" -u "$NEXUS_USERNAME" --password-stdin
            export NEXUS_REGISTRY IMAGE_TAG=latest
            docker compose pull
            docker compose up -d
