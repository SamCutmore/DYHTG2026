services:
  frontend:
    image: ${NEXUS_REGISTRY:-registry.negativeone.xyz}/negativeone-frontend:${IMAGE_TAG:-latest}
    container_name: negativeone_frontend
    restart: always
    ports:
      - "127.0.0.1:8088:80"

  backend:
    image: ${NEXUS_REGISTRY:-registry.negativeone.xyz}/negativeone-backend:${IMAGE_TAG:-latest}
    container_name: negativeone_backend
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
